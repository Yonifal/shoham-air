name: backfill neighbouring stations
on:
  workflow_dispatch:
    inputs:
      start: { description: "start date", default: "2025-12-01" }
permissions:
  contents: write
concurrency: { group: data-commit, cancel-in-progress: false }
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: python -m engine.backfill ${{ inputs.start }}
      - name: save data
        run: |
          git config user.name "shoham-air-bot"; git config user.email "bot@users.noreply.github.com"
          git add data/neighbors
          git diff --cached --quiet || git commit -qm "backfill neighbouring stations"
          for i in 1 2 3 4; do git pull -q --rebase -X theirs && git push -q && break; sleep $((i*5)); done
