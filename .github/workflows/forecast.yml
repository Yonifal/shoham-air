name: forecast
on:
  schedule:
    - cron: "11 3 * * *"     # 05:00 Israel – morning update (site only)
    - cron: "11 13 * * *"    # 15:00-16:00 Israel – daily alert for tonight
    - cron: "23 5 * * 0"
    - cron: "41 5 * * *"    # 07:41 Israel – morning check of last night's forecast     # Sunday – retrain on all accumulated data
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: data-commit, cancel-in-progress: false }
jobs:
  forecast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - if: github.event.schedule == '23 5 * * 0'
        run: python -m engine.run train
      - run: python -m engine.run verify
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - run: python -m engine.run forecast
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WA_TOKEN: ${{ secrets.WA_TOKEN }}
          WA_PHONE_ID: ${{ secrets.WA_PHONE_ID }}
          WA_RECIPIENTS: ${{ secrets.WA_RECIPIENTS }}
      - name: save data
        run: |
          git config user.name "shoham-air-bot"; git config user.email "bot@users.noreply.github.com"
          git add data docs/data
          git diff --cached --quiet || git commit -qm "forecast update"
          for i in 1 2 3 4; do git pull -q --rebase -X theirs && git push -q && break; sleep $((i*5)); done
