name: live station check
on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 min (GitHub may delay a few minutes)
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: data-commit, cancel-in-progress: false }
jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: python -m engine.run live
        env:
          REPORTS_URL: ${{ secrets.REPORTS_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WA_TOKEN: ${{ secrets.WA_TOKEN }}
          WA_PHONE_ID: ${{ secrets.WA_PHONE_ID }}
          WA_RECIPIENTS: ${{ secrets.WA_RECIPIENTS }}
      - name: save data
        run: |
          git config user.name "shoham-air-bot"; git config user.email "bot@users.noreply.github.com"
          git add data docs/data
          git diff --cached --quiet || (git commit -m "live update" && git pull --rebase && git push)
